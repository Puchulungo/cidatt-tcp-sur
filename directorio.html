<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIDATT TCP Sur — Directorio de Clientes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --navy: #0a1628;
    --navy-mid: #112240;
    --navy-light: #1d3461;
    --accent: #2563eb;
    --accent-light: #3b82f6;
    --steel: #94a3b8;
    --steel-light: #cbd5e1;
    --white: #f8fafc;
    --surface: #0f1f3d;
    --surface2: #162847;
    --border: rgba(148,163,184,0.15);
    --border-hover: rgba(59,130,246,0.4);
    --camion: #2563eb;
    --remolcador: #0891b2;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --success: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--navy);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--navy-mid);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    height: 60px;
  }

  .logo-text {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--accent-light);
    white-space: nowrap;
  }

  .logo-sep {
    width: 1px;
    height: 24px;
    background: var(--border);
  }

  .header-sub {
    font-size: 12px;
    color: var(--steel);
    letter-spacing: 0.04em;
  }

  .search-wrap {
    flex: 1;
    max-width: 480px;
    margin-left: auto;
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  #buscar {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px 8px 36px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  #buscar::placeholder { color: var(--text-muted); }
  #buscar:focus { border-color: var(--accent); }

  .stats-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 1.5rem;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 97px);
  }

  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    .panel-detail { display: none; }
    .panel-detail.active { display: block; }
  }

  .panel-list {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--navy-mid);
  }

  .panel-list::-webkit-scrollbar { width: 4px; }
  .panel-list::-webkit-scrollbar-track { background: transparent; }
  .panel-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .client-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }

  .client-item:hover { background: var(--surface2); }
  .client-item.active { background: var(--surface2); border-left: 2px solid var(--accent); }

  .client-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }

  .client-meta {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .client-ruc {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .client-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 500;
  }

  .badge-camion { background: rgba(37,99,235,0.2); color: #60a5fa; }
  .badge-rem { background: rgba(8,145,178,0.2); color: #22d3ee; }
  .badge-both { background: rgba(16,185,129,0.15); color: #34d399; }
  .badge-baja { background: rgba(248,113,113,0.15); color: #f87171; }

  .estado-tag { display: inline-flex; align-items: center; gap: 4px; }
  .estado-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .estado-activo { color: #34d399; }
  .estado-baja { color: #f87171; }

  .client-units {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
  }

  .no-results {
    padding: 3rem 1.5rem;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .loading {
    padding: 3rem 1.5rem;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .panel-detail {
    overflow-y: auto;
    background: var(--navy);
    padding: 1.5rem;
  }

  .panel-detail::-webkit-scrollbar { width: 4px; }
  .panel-detail::-webkit-scrollbar-track { background: transparent; }
  .panel-detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty-state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);
  }

  .empty-icon {
    width: 48px;
    height: 48px;
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .empty-state p { font-size: 13px; }

  .ficha {
    max-width: 700px;
  }

  .ficha-header {
    margin-bottom: 1.5rem;
  }

  .ficha-razon {
    font-size: 18px;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .ficha-ruc {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--accent-light);
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  @media (max-width: 600px) {
    .info-grid { grid-template-columns: 1fr; }
  }

  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
  }

  .info-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .info-value {
    font-size: 13px;
    color: var(--text);
    word-break: break-word;
  }

  .info-card.full { grid-column: 1 / -1; }

  .vehiculos-section {
    margin-top: 1rem;
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .tree {
    font-size: 13px;
  }

  .tree-clase {
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .tree-clase-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    cursor: pointer;
    background: var(--surface);
    user-select: none;
    transition: background 0.15s;
  }

  .tree-clase-header:hover { background: var(--surface2); }

  .tree-toggle {
    width: 14px;
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 10px;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .tree-toggle.open { transform: rotate(90deg); }

  .clase-label {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.03em;
  }

  .clase-camion { color: #60a5fa; }
  .clase-rem { color: #22d3ee; }

  .clase-count {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .tree-clase-body { display: none; }
  .tree-clase-body.open { display: block; }

  .tree-marca {
    border-top: 1px solid var(--border);
  }

  .tree-marca-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px 8px 28px;
    cursor: pointer;
    background: var(--navy-mid);
    user-select: none;
    transition: background 0.15s;
  }

  .tree-marca-header:hover { background: var(--surface2); }

  .marca-label {
    font-weight: 500;
    font-size: 12px;
    color: var(--steel-light);
  }

  .marca-count {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .tree-marca-body { display: none; }
  .tree-marca-body.open { display: block; }

  .tree-modelo {
    border-top: 1px solid var(--border);
  }

  .tree-modelo-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 42px;
    cursor: pointer;
    background: var(--navy);
    user-select: none;
    transition: background 0.15s;
  }

  .tree-modelo-header:hover { background: var(--surface); }

  .modelo-label {
    font-size: 12px;
    color: var(--steel);
    font-weight: 500;
  }

  .modelo-count {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .tree-modelo-body { display: none; }
  .tree-modelo-body.open { display: block; }

  .tree-year {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 14px 5px 58px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .year-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .year-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .total-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(37,99,235,0.15);
    border: 1px solid rgba(37,99,235,0.3);
    border-radius: 4px;
    padding: 2px 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #60a5fa;
    margin-bottom: 1rem;
  }

  .back-btn {
    display: none;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 12px;
    padding: 6px 12px;
    cursor: pointer;
    margin-bottom: 1rem;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  @media (max-width: 768px) {
    .back-btn { display: flex; }
  }

  /* --- Auth Gate --- */
  #auth-gate {
    position: fixed; inset: 0; z-index: 1000;
    background: var(--navy);
    display: flex; align-items: center; justify-content: center;
  }
  .auth-box {
    text-align: center; max-width: 360px; padding: 2rem;
  }
  .auth-logo {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
  }
  .auth-title { font-size: 1.4rem; font-weight: 600; color: var(--white); margin-bottom: 0.4rem; }
  .auth-sub { font-size: 0.85rem; color: var(--steel); margin-bottom: 2rem; }
  .auth-btn {
    width: 100%; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 12px 20px; font-size: 0.9rem; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: 'IBM Plex Sans', sans-serif; transition: background 0.15s;
  }
  .auth-btn:hover { background: var(--accent-light); }
  .auth-error { margin-top: 1rem; color: #f87171; font-size: 0.8rem; }
  .auth-loading { color: var(--steel); font-size: 0.85rem; }
  #app-content { display: none; }

  .flota-anio-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 14px 6px 30px;
    border-top: 1px solid var(--border);
    background: var(--navy);
  }
  .flota-anio-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--steel-light);
  }
  .flota-anio-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  .flota-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 14px 6px 46px;
    font-size: 12px;
    color: var(--steel);
    border-top: 1px solid rgba(148,163,184,0.06);
  }
  .flota-row-label { color: var(--steel-light); }
  .flota-row-rango {
    color: var(--text-muted);
    font-size: 11px;
    margin-left: 6px;
  }
  .flota-row-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: #60a5fa;
    flex-shrink: 0;
    margin-left: 10px;
  }
</style>
</head>
<body>

<div id="auth-gate">
  <div class="auth-box" id="auth-box">
    <div class="auth-logo">
      <svg width="28" height="28" viewBox="0 0 21 21" fill="none"><rect x="1" y="1" width="9" height="9" fill="#fff"/><rect x="11" y="1" width="9" height="9" fill="#fff" opacity="0.7"/><rect x="1" y="11" width="9" height="9" fill="#fff" opacity="0.7"/><rect x="11" y="11" width="9" height="9" fill="#fff" opacity="0.4"/></svg>
    </div>
    <div class="auth-title">CIDATT TCP Sur</div>
    <div class="auth-sub">Acceso restringido &mdash; Grupo Euromotors</div>
    <button class="auth-btn" id="btn-login" style="display:none">
      <svg width="16" height="16" viewBox="0 0 21 21" fill="none"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>
      Iniciar sesión con Microsoft
    </button>
    <div class="auth-loading" id="auth-status">Verificando sesión...</div>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<div id="app-content">

<header>
  <span class="logo-text">CIDATT TCP Sur</span>
  <div class="logo-sep"></div>
  <span class="header-sub">Directorio de Clientes</span>
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="buscar" type="text" placeholder="Buscar por RUC, razón social o nombre comercial..." autocomplete="off" spellcheck="false">
  </div>
  <a href="perfilador.html" style="margin-left:12px; color:#94a3b8; text-decoration:none; font-size:12px; font-family:'IBM Plex Mono',monospace; padding:6px 12px; border:1px solid rgba(148,163,184,0.15); border-radius:6px; white-space:nowrap;">Perfilador &#8594;</a>
  <a href="index.html" style="margin-left:6px; color:#94a3b8; text-decoration:none; font-size:12px; font-family:'IBM Plex Mono',monospace; padding:6px 12px; border:1px solid rgba(148,163,184,0.15); border-radius:6px; white-space:nowrap;">&#8962; Inicio</a>
</header>

<div class="stats-bar">
  <span class="stat-pill">
    <span class="stat-dot" style="background:#60a5fa"></span>
    <span id="stat-total">Cargando...</span>
  </span>
  <span id="stat-filter" style="display:none" class="stat-pill">
    <span class="stat-dot" style="background:#34d399"></span>
    <span id="stat-filter-text"></span>
  </span>
</div>

<div class="layout">
  <div class="panel-list" id="lista">
    <div class="loading">Cargando directorio...</div>
  </div>
  <div class="panel-detail" id="detalle">
    <div class="empty-state">
      <div class="empty-icon">&#9776;</div>
      <p>Selecciona un cliente para ver su ficha</p>
    </div>
  </div>
</div>

<script>
let CLIENTES = [];
let clienteActivo = null;
let timeoutBusqueda = null;

async function cargarDatos() {
  try {
    const res = await fetch('clientes_v2.json');
    CLIENTES = await res.json();
    document.getElementById('stat-total').textContent = CLIENTES.length.toLocaleString() + ' clientes en cartera';
    filtrar();
  } catch(e) {
    document.getElementById('lista').innerHTML = '<div class="no-results">Error al cargar clientes_v2.json.<br>Asegúrate de que ambos archivos estén en la misma carpeta.</div>';
  }
}

function getTipos(c) {
  if (!c.vehiculos || c.vehiculos.length === 0) return 'camion';
  const clases = new Set(c.vehiculos.map(v => v.clase));
  if (clases.has('CAMION') && clases.has('REMOLCADOR')) return 'both';
  if (clases.has('CAMION')) return 'camion';
  return 'rem';
}

function getTotalUnidades(c) {
  return c.vehiculos ? c.vehiculos.length : 0;
}

function renderCard(c) {
  const tipo = getTipos(c);
  const total = getTotalUnidades(c);
  const badgeMap = {
    camion: '<span class="client-badge badge-camion">CAMIÓN</span>',
    rem: '<span class="client-badge badge-rem">REMOLCADOR</span>',
    both: '<span class="client-badge badge-both">CAMIÓN + REM.</span>'
  };
  const deBaja = c.estado && c.estado !== 'SIN DATOS' && c.estado !== 'ACTIVO';
  const bajaBadge = deBaja ? '<span class="client-badge badge-baja" title="' + c.estado + '">DE BAJA</span>' : '';
  return `<div class="client-item${clienteActivo === c.ruc ? ' active' : ''}" data-ruc="${c.ruc}" onclick="seleccionar('${c.ruc}')">
    <div class="client-name">${c.razon}</div>
    <div class="client-meta">
      <span class="client-ruc">${c.ruc}</span>
      ${badgeMap[tipo]}
      ${bajaBadge}
    </div>
    <span class="client-units">${total}</span>
  </div>`;
}

function filtrar() {
  const query = document.getElementById('buscar').value.trim().toLowerCase();
  let filtrados = [];

  if (!query) {
    filtrados = CLIENTES;
  } else {
    filtrados = CLIENTES.filter(c =>
      c.ruc.toLowerCase().includes(query) ||
      c.razon.toLowerCase().includes(query) ||
      (c.nombre_comercial && c.nombre_comercial !== 'SIN DATOS' && c.nombre_comercial.toLowerCase().includes(query))
    );
  }

  const lista = document.getElementById('lista');
  const statFilter = document.getElementById('stat-filter');
  const statFilterText = document.getElementById('stat-filter-text');

  if (query) {
    statFilter.style.display = 'flex';
    statFilterText.textContent = filtrados.length.toLocaleString() + ' resultado(s)';
  } else {
    statFilter.style.display = 'none';
  }

  if (filtrados.length === 0) {
    lista.innerHTML = '<div class="no-results">No se encontraron clientes.</div>';
    return;
  }

  const mostrar = filtrados.slice(0, 80);
  lista.innerHTML = mostrar.map(renderCard).join('');
  if (filtrados.length > 80) {
    lista.innerHTML += `<div class="no-results">Mostrando 80 de ${filtrados.length.toLocaleString()}. Afina la búsqueda.</div>`;
  }
}

// Debounce para evitar que el navegador se congele al escribir rápido
document.getElementById('buscar').addEventListener('input', () => {
  clearTimeout(timeoutBusqueda);
  timeoutBusqueda = setTimeout(filtrar, 250);
});

function buildTree(vehiculos) {
  const tree = {};
  if (!vehiculos) return tree;
  for (const v of vehiculos) {
    const clase = v.clase || 'OTRO';
    const marca = v.marca || 'SIN MARCA';
    const modelo = v.modelo || 'SIN MODELO';
    const año = v.año || 'S/D';
    if (!tree[clase]) tree[clase] = {};
    if (!tree[clase][marca]) tree[clase][marca] = {};
    if (!tree[clase][marca][modelo]) tree[clase][marca][modelo] = {};
    tree[clase][marca][modelo][año] = (tree[clase][marca][modelo][año] || 0) + 1;
  }
  return tree;
}

function renderTree(tree) {
  let html = '<div class="tree">';
  for (const clase of Object.keys(tree).sort()) {
    const claseData = tree[clase];
    const totalClase = Object.values(claseData).reduce((s, m) => s + Object.values(m).reduce((s2, mo) => s2 + Object.values(mo).reduce((a, b) => a + b, 0), 0), 0);
    const claseClass = clase === 'CAMION' ? 'clase-camion' : 'clase-rem';
    const claseId = 'clase_' + Math.random().toString(36).slice(2);
    html += `<div class="tree-clase">
      <div class="tree-clase-header" onclick="toggleNode('${claseId}', this)">
        <span class="tree-toggle">&#9654;</span>
        <span class="clase-label ${claseClass}">${clase}</span>
        <span class="clase-count">${totalClase} unidades</span>
      </div>
      <div class="tree-clase-body" id="${claseId}">`;

    for (const marca of Object.keys(claseData).sort()) {
      const marcaData = claseData[marca];
      const totalMarca = Object.values(marcaData).reduce((s, mo) => s + Object.values(mo).reduce((a, b) => a + b, 0), 0);
      const marcaId = 'marca_' + Math.random().toString(36).slice(2);
      html += `<div class="tree-marca">
        <div class="tree-marca-header" onclick="toggleNode('${marcaId}', this)">
          <span class="tree-toggle">&#9654;</span>
          <span class="marca-label">${marca}</span>
          <span class="marca-count">${totalMarca}</span>
        </div>
        <div class="tree-marca-body" id="${marcaId}">`;

      for (const modelo of Object.keys(marcaData).sort()) {
        const modeloData = marcaData[modelo];
        const totalModelo = Object.values(modeloData).reduce((a, b) => a + b, 0);
        const modeloId = 'modelo_' + Math.random().toString(36).slice(2);
        html += `<div class="tree-modelo">
          <div class="tree-modelo-header" onclick="toggleNode('${modeloId}', this)">
            <span class="tree-toggle">&#9654;</span>
            <span class="modelo-label">${modelo}</span>
            <span class="modelo-count">${totalModelo}</span>
          </div>
          <div class="tree-modelo-body" id="${modeloId}">`;

        for (const año of Object.keys(modeloData).sort()) {
          html += `<div class="tree-year">
            <span class="year-label">${año}</span>
            <span class="year-count">${modeloData[año]}</span>
          </div>`;
        }

        html += `</div></div>`;
      }
      html += `</div></div>`;
    }
    html += `</div></div>`;
  }
  html += '</div>';
  return html;
}

function toggleNode(id, header) {
  const body = document.getElementById(id);
  const toggle = header.querySelector('.tree-toggle');
  const isOpen = body.classList.toggle('open');
  toggle.classList.toggle('open', isOpen);
}

// Al abrir una categoria de peso, despliega automaticamente todos los años debajo
// (evita tener que hacer click año por año)
function toggleCategoria(id, header) {
  const body = document.getElementById(id);
  const toggle = header.querySelector('.tree-toggle');
  const isOpen = body.classList.toggle('open');
  toggle.classList.toggle('open', isOpen);

  body.querySelectorAll('.tree-modelo-body').forEach(yearBody => {
    yearBody.classList.toggle('open', isOpen);
  });
  body.querySelectorAll('.tree-modelo-header .tree-toggle').forEach(yearToggle => {
    yearToggle.classList.toggle('open', isOpen);
  });
}


// --- Enriquecimiento de ficha con datos del perfilador (peso, provincia, categoria) ---
const PERFILADOR_CACHE = {};

function slugifyDepto(s) {
  if (!s) return 'sin_datos';
  return s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '').toLowerCase() || 'sin_datos';
}

async function loadPerfiladorShard(slug) {
  if (PERFILADOR_CACHE[slug]) return PERFILADOR_CACHE[slug];
  try {
    const res = await fetch(`data/perfilador/${slug}.json`);
    if (!res.ok) return null;
    const data = await res.json();
    PERFILADOR_CACHE[slug] = data;
    return data;
  } catch (e) {
    return null;
  }
}

async function getEnrichedClient(c) {
  const slug = slugifyDepto(c.ciudad);
  const shard = await loadPerfiladorShard(slug);
  if (!shard) return null;
  return shard.find(x => x.ruc === c.ruc) || null;
}

const CATEGORIA_RANGOS = {
  CAMION: {
    'Ligero': 'hasta 7 t',
    'Semiliviano': '7 – 10.5 t',
    'Mediano': '10.5 – 25 t',
    'Pesado': '25 – 33 t',
    'Extra pesado': 'desde 33 t',
  },
  REMOLCADOR: {
    'Estándar': 'hasta 25 t',
    'Semipesado': '25 – 28 t',
    'Pesado': '28 – 32 t',
    'Extra pesado': 'desde 32 t',
  },
};
function rangoCategoria(clase, cat) {
  const r = (CATEGORIA_RANGOS[clase] || {})[cat];
  return r ? ` (${r})` : '';
}

function buildTreeEnriched(vehiculos) {
  const tree = {};
  for (const v of vehiculos) {
    if (v.atipico) continue;
    const clase = v.clase || 'OTRO';
    const anio = v.anio || 'S/D';
    const marca = v.marca || 'SIN MARCA';
    const cat = v.categoria_peso || 'SIN DATOS';
    if (!tree[clase]) tree[clase] = {};
    if (!tree[clase][anio]) tree[clase][anio] = {};
    const key = marca + '|||' + cat;
    tree[clase][anio][key] = (tree[clase][anio][key] || 0) + 1;
  }
  return tree;
}

function rangoTexto(clase, cat) {
  const r = (CATEGORIA_RANGOS[clase] || {})[cat];
  return r || cat;
}

function renderTreeEnriched(tree) {
  let html = '<div class="tree">';
  for (const clase of Object.keys(tree).sort()) {
    const aniosData = tree[clase];
    const totalClase = Object.values(aniosData).reduce((s, filas) =>
      s + Object.values(filas).reduce((a, b) => a + b, 0), 0);
    const claseClass = clase === 'CAMION' ? 'clase-camion' : 'clase-rem';
    const claseId = 'clase_' + Math.random().toString(36).slice(2);

    html += `<div class="tree-clase">
      <div class="tree-clase-header" onclick="toggleNode('${claseId}', this)">
        <span class="tree-toggle">&#9654;</span>
        <span class="clase-label ${claseClass}">${clase}</span>
        <span class="clase-count">${totalClase} unidades</span>
      </div>
      <div class="tree-clase-body" id="${claseId}">`;

    const anios = Object.keys(aniosData).sort((a, b) => {
      if (a === 'S/D') return 1;
      if (b === 'S/D') return -1;
      return b - a; // año descendente: mas reciente primero
    });

    for (const anio of anios) {
      const filas = aniosData[anio];
      const totalAnio = Object.values(filas).reduce((a, b) => a + b, 0);

      html += `<div class="flota-anio-header">
        <span class="flota-anio-label">${anio}</span>
        <span class="flota-anio-count">${totalAnio} unidad${totalAnio !== 1 ? 'es' : ''}</span>
      </div>`;

      const filasOrdenadas = Object.entries(filas).sort((a, b) => b[1] - a[1]); // mayor cantidad primero
      for (const [key, count] of filasOrdenadas) {
        const [marca, cat] = key.split('|||');
        html += `<div class="flota-row">
          <span class="flota-row-label">${marca} <span class="flota-row-rango">&mdash; ${rangoTexto(clase, cat)}</span></span>
          <span class="flota-row-count">${count}</span>
        </div>`;
      }
    }

    html += `</div></div>`;
  }
  html += '</div>';
  return html;
}

function formatAntiguedad(fechaIso) {
  if (!fechaIso || fechaIso === 'SIN DATOS') return 'SIN DATOS';
  const inicio = new Date(fechaIso);
  if (isNaN(inicio.getTime())) return 'SIN DATOS';
  const hoy = new Date();
  let anos = hoy.getFullYear() - inicio.getFullYear();
  const m = hoy.getMonth() - inicio.getMonth();
  if (m < 0 || (m === 0 && hoy.getDate() < inicio.getDate())) anos--;
  const fechaTexto = inicio.toLocaleDateString('es-PE', { year: 'numeric', month: 'long', day: 'numeric' });
  return `${anos} año${anos !== 1 ? 's' : ''} (desde ${fechaTexto})`;
}

async function seleccionar(ruc) {
  const c = CLIENTES.find(x => x.ruc === ruc);
  if (!c) return;
  clienteActivo = ruc;

  document.querySelectorAll('.client-item').forEach(el => el.classList.remove('active'));
  const targetItem = document.querySelector(`.client-item[data-ruc="${ruc}"]`);
  if (targetItem) targetItem.classList.add('active');

  const detalle = document.getElementById('detalle');
  detalle.innerHTML = '<div class="loading">Cargando ficha...</div>';
  detalle.classList.add('active');
  detalle.scrollTop = 0;

  const enriched = await getEnrichedClient(c);

  const departamento = c.ciudad || 'SIN DATOS';
  const provincia = enriched ? enriched.provincia : (c.provincia || 'SIN DATOS');
  const distrito = c.distrito || 'SIN DATOS';
  const total = enriched ? enriched.vehiculos.filter(v => !v.atipico).length : getTotalUnidades(c);
  const treeHtml = enriched ? renderTreeEnriched(buildTreeEnriched(enriched.vehiculos)) : renderTree(buildTree(c.vehiculos));

  const esActivo = c.estado === 'ACTIVO';
  const estadoHtml = c.estado && c.estado !== 'SIN DATOS'
    ? `<span class="estado-tag ${esActivo ? 'estado-activo' : 'estado-baja'}"><span class="estado-dot" style="background:currentColor"></span>${c.estado}</span>`
    : 'SIN DATOS';

  const campos = [
    { label: 'RUC', value: c.ruc, full: false },
    { label: 'Estado', value: estadoHtml, full: false, raw: true },
    { label: 'Antigüedad del negocio', value: formatAntiguedad(c.fecha_inicio_actividades), full: false },
    { label: 'Tipo de Contribuyente', value: c.tipo_contribuyente, full: false },
    { label: 'Sector Económico', value: c.sector_economico, full: false },
    { label: 'Principal CIIU', value: c.ciiu, full: true },
    { label: 'Departamento', value: departamento, full: false },
    { label: 'Provincia', value: provincia, full: false },
    { label: 'Distrito', value: distrito, full: false },
    { label: 'Dirección', value: c.direccion, full: true },
    { label: 'Teléfono', value: c.telefono, full: false },
    { label: 'Email', value: c.email, full: false },
    { label: 'Representante Legal', value: c.representante, full: true },
  ];

  const nombreComercialHtml = (c.nombre_comercial && c.nombre_comercial !== 'SIN DATOS' && c.nombre_comercial !== c.razon)
    ? `<div class="ficha-ruc" style="margin-top:2px;">Nombre comercial: ${c.nombre_comercial}</div>` : '';

  detalle.innerHTML = `
    <div class="ficha">
      <button class="back-btn" onclick="volverLista()">&#8592; Volver</button>
      <div class="ficha-header">
        <div class="ficha-razon">${c.razon}</div>
        <div class="ficha-ruc">RUC ${c.ruc}</div>
        ${nombreComercialHtml}
      </div>
      <div class="info-grid">
        ${campos.map(f => `
          <div class="info-card${f.full ? ' full' : ''}">
            <div class="info-label">${f.label}</div>
            <div class="info-value">${f.raw ? (f.value || 'SIN DATOS') : ((f.value && f.value !== 'SIN DATOS') ? f.value : 'SIN DATOS')}</div>
          </div>
        `).join('')}
      </div>
      <div class="vehiculos-section">
        <div class="section-title">Flota registrada</div>
        <div class="total-badge">${total} unidad${total !== 1 ? 'es' : ''} en total</div>
        ${treeHtml}
      </div>
    </div>
  `;

  detalle.scrollTop = 0;
}

function volverLista() {
  document.getElementById('detalle').classList.remove('active');
}
