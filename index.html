<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIDATT TCP Sur</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --navy: #0a1628;
    --navy-mid: #112240;
    --accent: #2563eb;
    --accent-light: #3b82f6;
    --steel: #94a3b8;
    --steel-light: #cbd5e1;
    --white: #f8fafc;
    --surface: #0f1f3d;
    --surface2: #162847;
    --border: rgba(148,163,184,0.15);
    --border-hover: rgba(59,130,246,0.4);
    --text: #e2e8f0;
    --text-muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--navy);
    color: var(--text);
    min-height: 100vh;
  }

  #auth-gate {
    position: fixed; inset: 0; z-index: 1000;
    background: var(--navy);
    display: flex; align-items: center; justify-content: center;
  }
  .auth-box { text-align: center; max-width: 360px; padding: 2rem; }
  .auth-logo {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
  }
  .auth-title { font-size: 1.4rem; font-weight: 600; color: var(--white); margin-bottom: 0.4rem; }
  .auth-sub { font-size: 0.85rem; color: var(--steel); margin-bottom: 2rem; }
  .auth-btn {
    width: 100%; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 12px 20px; font-size: 0.9rem; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: 'IBM Plex Sans', sans-serif; transition: background 0.15s;
  }
  .auth-btn:hover { background: var(--accent-light); }
  .auth-error { margin-top: 1rem; color: #f87171; font-size: 0.8rem; }
  .auth-loading { color: var(--steel); font-size: 0.85rem; }
  #app-content { display: none; }

  .landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  .landing-logo {
    width: 200px;
    max-width: 70vw;
    margin-bottom: 1.5rem;
    background: #fff;
    border-radius: 16px;
    padding: 14px;
  }
  .landing-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.1em;
    color: var(--accent-light);
    margin-bottom: 0.3rem;
  }
  .landing-sub {
    font-size: 13px;
    color: var(--steel);
    margin-bottom: 2.5rem;
  }
  .landing-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 340px;
  }
  .landing-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    text-decoration: none;
    color: var(--white);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .landing-btn:hover:not(.disabled) {
    border-color: var(--border-hover);
    background: var(--surface2);
    transform: translateY(-1px);
  }
  .landing-btn .arrow { color: var(--text-muted); font-size: 16px; }
  .landing-btn.disabled {
    opacity: 0.45;
    cursor: not-allowed;
    color: var(--steel);
  }
  .badge-proximamente {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.02em;
    background: rgba(148,163,184,0.15);
    color: var(--steel);
    border-radius: 20px;
    padding: 3px 10px;
    text-transform: none;
  }
</style>
</head>
<body>

<div id="auth-gate">
  <div class="auth-box" id="auth-box">
    <div class="auth-logo">
      <svg width="28" height="28" viewBox="0 0 21 21" fill="none"><rect x="1" y="1" width="9" height="9" fill="#fff"/><rect x="11" y="1" width="9" height="9" fill="#fff" opacity="0.7"/><rect x="1" y="11" width="9" height="9" fill="#fff" opacity="0.7"/><rect x="11" y="11" width="9" height="9" fill="#fff" opacity="0.4"/></svg>
    </div>
    <div class="auth-title">CIDATT TCP Sur</div>
    <div class="auth-sub">Acceso restringido &mdash; Grupo Euromotors</div>
    <button class="auth-btn" id="btn-login" style="display:none">
      <svg width="16" height="16" viewBox="0 0 21 21" fill="none"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>
      Iniciar sesión con Microsoft
    </button>
    <div class="auth-loading" id="auth-status">Verificando sesión...</div>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<div id="app-content">
  <div class="landing">
    <img src="logo.png" alt="Truck Center Peru" class="landing-logo">
    <div class="landing-title">CIDATT TCP SUR</div>
    <div class="landing-sub">Base de datos comercial &mdash; Grupo Euromotors</div>
    <div class="landing-buttons">
      <a href="directorio.html" class="landing-btn">
        DIRECTORIO
        <span class="arrow">&#8594;</span>
      </a>
      <a href="perfilador.html" class="landing-btn">
        PERFILADOR
        <span class="arrow">&#8594;</span>
      </a>
      <a href="#" class="landing-btn disabled" onclick="return false;">
        CARTERAS TCP
        <span class="badge-proximamente">Próximamente</span>
      </a>
    </div>
  </div>
</div>

<script src="lib/msal-browser.min.js"></script>
<script>
// cargarDatos no aplica en el landing; se define vacío para reusar auth.js sin cambios
function cargarDatos() {}
</script>
<script src="auth.js"></script>
</body>
</html>
